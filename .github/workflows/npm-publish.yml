name: Publish to npm

# npm publish — GitHub Secret の NPM_TOKEN (npmjs.com の Automation トークン) で認証する。
# 発火: release/x.y.z ブランチの push、または手動実行。

on:
  push:
    branches:
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Verify release branch matches package.json version
        if: startsWith(github.ref_name, 'release/')
        run: |
          BR="${GITHUB_REF_NAME#release/}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$BR" != "$PKG" ]; then
            echo "::error::Release branch '$BR' does not match package.json version '$PKG'"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
