name: Publish to npm

# npm publish は npm Trusted Publishing の OIDC 認証を使う。
# 発火: release/x.y.z ブランチの push、または手動実行。

on:
  push:
    branches:
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Prepare OIDC-capable npm CLI
        run: npm install --global npm@11.19.1

      - name: Verify release branch matches package.json version
        if: startsWith(github.ref_name, 'release/')
        run: |
          BR="${GITHUB_REF_NAME#release/}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$BR" != "$PKG" ]; then
            echo "::error::Release branch '$BR' does not match package.json version '$PKG'"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --access public --provenance --registry=https://registry.npmjs.org/
