name: Publish to npm

# 公開は native C# / .NET / cosign（PowerShell入口）と npm Trusted Publishing の OIDC 認証を使う。
# 発火: main のコミットに付けた軽量タグ vx.y.z の push、または既存タグを --ref に指定した手動実行（やり直し専用）。

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout release commit with native git
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Prepare Bun build toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/bun.zip" https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-x64-baseline.zip
          echo 'e0446eb55995772eb9894bebae9a6be368d985a8b9271ee124486f9946eedd76  '"$RUNNER_TEMP/bun.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP/bun"
          echo "$RUNNER_TEMP/bun/bun-linux-x64-baseline" >> "$GITHUB_PATH"

      # 公開は main の祖先 commit に付けた軽量タグ vx.y.z からだけ行う。push / workflow_dispatch のどちらでも必須で、skip させない。
      - name: Verify release tag matches package.json version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" == tag ]] || { echo "::error::タグ以外では公開しない: $GITHUB_REF"; exit 1; }
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "::error::版タグの形ではない: $GITHUB_REF_NAME"; exit 1; }
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::GITHUB_SHA が不正"; exit 1; }
          # 軽量タグで、いまもこの commit を指すこと
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.type+" "+.object.sha')" == "commit $GITHUB_SHA" ]] \
            || { echo "::error::タグが $GITHUB_SHA を指す軽量タグではない"; exit 1; }
          # 既定ブランチの祖先であること（compare API）
          default="$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)"
          cmp="$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$default?per_page=1" --jq '.status+" "+(.behind_by|tostring)')"
          [[ "$cmp" == "ahead 0" || "$cmp" == "identical 0" ]] || { echo "::error::$default の祖先ではない ($cmp)"; exit 1; }
          # package.json の版との一致
          PKG=$(bun -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$PKG" ]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' does not match package.json version '$PKG'"
            exit 1
          fi
          echo "Release tag and package.json agree on $PKG"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 公開物の build・署名・アップロードより前に lint とテストを通す。失敗したら公開しない。
      - name: Lint
        run: bun --no-env-file --no-install --bun run lint

      - name: Test
        run: bun --no-env-file --no-install run test

      - name: Test built stdio server
        run: bun --no-env-file --no-install run test:stdio

      - name: Build
        run: bun --bun run build

      - name: Package and verify publication artifact
        id: package
        shell: pwsh
        run: |
          $archive = bun pm pack --quiet
          if ($LASTEXITCODE -ne 0) { throw 'Bun pack failed' }
          $verified = ./scripts/verify-bun-package.ps1 -PackageFile $archive
          "file=$($verified.PackageFile)" >> $env:GITHUB_OUTPUT
          "integrity=$($verified.Integrity)" >> $env:GITHUB_OUTPUT

      - name: Validate native npm publisher contracts
        shell: pwsh
        run: ./scripts/Test-NpmPublisher.ps1 -WorkDirectory (Join-Path $env:RUNNER_TEMP 'npm-publisher-contracts')
      - name: Publish verified artifact with native OIDC
        shell: pwsh
        env:
          PACKAGE_FILE: ${{ steps.package.outputs.file }}
          PACKAGE_INTEGRITY: ${{ steps.package.outputs.integrity }}
        run: ./scripts/Publish-Npm.ps1 -PackageFile $env:PACKAGE_FILE -ExpectedIntegrity $env:PACKAGE_INTEGRITY
