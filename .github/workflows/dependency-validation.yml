name: Dependency validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Bun は npm-publish.yml と同じ URL・SHA-256 で直接取得する（setup-bun は使わない）。
      - name: Prepare verified Bun toolchain
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/bun.zip"
          curl --fail --location --retry 3 --output "$archive" https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-x64-baseline.zip
          echo 'e0446eb55995772eb9894bebae9a6be368d985a8b9271ee124486f9946eedd76  '"$archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/bun"
          echo "$RUNNER_TEMP/bun/bun-linux-x64-baseline" >> "$GITHUB_PATH"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Validate native npm publisher contracts
        shell: pwsh
        run: ./scripts/Test-NpmPublisher.ps1 -WorkDirectory (Join-Path $env:RUNNER_TEMP 'npm-publisher-contracts')
      - name: Lint
        run: bun --no-env-file --no-install --bun run lint
      - name: Test
        run: bun --no-env-file --no-install run test
      - name: Test built stdio server
        run: bun --no-env-file --no-install run test:stdio
      - name: Pack and verify release artifact
        id: package
        shell: pwsh
        run: |
          $archive = bun pm pack --quiet --destination $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Bun pack failed' }
          if (-not [IO.Path]::IsPathRooted($archive)) { $archive = Join-Path $env:RUNNER_TEMP $archive }
          ./scripts/verify-bun-package.ps1 -PackageFile $archive | Out-Null
          "file=$archive" >> $env:GITHUB_OUTPUT
      # 実インストールはレジストリから範囲内の最新を解決するため、bun.lock と依存の版がずれ得る。
      - name: Validate packaged Bun execution
        env:
          PACKAGE_FILE: ${{ steps.package.outputs.file }}
        run: bun scripts/verify-packaged-bun.mjs "$PACKAGE_FILE" "$RUNNER_TEMP/packaged-bun"
